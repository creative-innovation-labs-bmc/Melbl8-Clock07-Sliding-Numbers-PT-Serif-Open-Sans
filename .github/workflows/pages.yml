name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Melbourne weather data
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=-37.8183"
              "&longitude=144.9479"
              "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m"
              "&temperature_unit=celsius"
              "&wind_speed_unit=kmh"
              "&timezone=Australia%2FMelbourne"
          )

          payload = {
              "temperature": None,
              "humidity": None,
              "code": None,
              "wind": None,
              "updated": None,
          }

          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "clock07-weather"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      current = json.load(response).get("current", {})
                  payload = {
                      "temperature": current.get("temperature_2m"),
                      "humidity": current.get("relative_humidity_2m"),
                      "code": current.get("weather_code"),
                      "wind": current.get("wind_speed_10m"),
                      "updated": current.get("time"),
                  }
                  break
              except Exception:
                  if attempt < 2:
                      time.sleep(3)

          Path("weather-data.js").write_text(
              "window.__clock07Weather = " + json.dumps(payload, separators=(",", ":")) + ";\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
